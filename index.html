<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#12060A;--g1:rgba(150,25,48,.38);--g2:rgba(40,8,16,.55);--line:rgba(255,130,150,.3);--spec:rgba(255,220,225,.3);--text:#FBEFE8;--muted:#E0B4BB;--b1:rgba(190,20,50,.38);--b2:rgba(120,10,40,.35);--rose:#FF7A90;--in:rgba(0,0,0,.3)}
:root[data-theme=light]{--bg:#F7E9E6;--g1:rgba(255,255,255,.7);--g2:rgba(255,230,230,.5);--line:rgba(160,30,55,.3);--spec:rgba(255,255,255,.9);--text:#2A0A10;--muted:#6E3541;--b1:rgba(255,120,140,.35);--b2:rgba(255,190,170,.4);--rose:#B3122D;--in:rgba(120,20,40,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:14px;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--text);background:radial-gradient(700px 500px at 85% 0,var(--b1),transparent),radial-gradient(600px 500px at 0 100%,var(--b2),transparent),var(--bg);background-attachment:fixed;min-height:100vh}
.app{display:flex;flex-wrap:wrap;gap:14px;padding:14px;align-items:flex-start}
main{flex:999 1 560px;min-width:0}
.glass{background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 var(--spec),0 24px 50px -24px rgba(0,0,0,.6);padding:16px;box-sizing:border-box;min-width:0}
.side{width:62px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;border-radius:22px}
.logo{font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--rose);padding:6px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.full{grid-column:1/-1}
.hud{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
h1{font-size:clamp(22px,3vw,30px);line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.nav{width:40px;height:40px;border-radius:13px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.nav:hover{border-color:var(--line);color:var(--text)}
.nav.on{background:linear-gradient(145deg,#E0263F,#7A0F24);color:#fff;box-shadow:0 0 22px #E0263F88,inset 0 1px 0 rgba(255,255,255,.4)}
.btn{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 18px;min-height:40px;font-weight:600;background:linear-gradient(180deg,#F0405A,#9B1230 70%);color:#fff;box-shadow:0 10px 30px -10px #E0263F,inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.ghost{border:1px solid var(--line);background:var(--in);border-radius:999px;padding:7px 13px;min-height:36px;font-size:12px}
.ghost.on{border-color:var(--rose);background:rgba(224,38,63,.4);color:#fff}
.chk{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--in);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.chk.on{background:#E0263F;color:#fff;border-color:#FF7A90;box-shadow:0 0 16px #E0263F99}
.x{width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:20px;flex:none}
.x:hover{color:var(--rose)}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.fl{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.dn{opacity:.5;text-decoration:line-through}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.p2{color:var(--rose);border-color:var(--rose)}.od{background:#E0263F;color:#fff;border-color:#E0263F}
input,select,textarea{font:inherit;color:var(--text);background:var(--in);border:1px solid var(--line);border-radius:14px;padding:7px 12px;min-height:38px;box-sizing:border-box;min-width:0;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
form input[type=text]{flex:1 1 200px}
.bar{height:10px;border-radius:99px;background:var(--in);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9B1230,#FF7A90);box-shadow:0 0 12px #FF4D6A}
.ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px #E0263F66}
.ring div{width:96px;height:96px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:16px;color:var(--text)}
.empty{color:var(--muted);line-height:1.5;margin:6px 0}
.avw{position:relative;width:150px;height:130px;display:flex;align-items:center;justify-content:center;transform:scale(.8);margin:-14px auto}
.avb{position:relative;display:flex;gap:16px;align-items:center;justify-content:center;animation:float 4s ease-in-out infinite}
.avb i{display:block}
.visor{position:absolute;left:8%;right:8%;top:30%;height:26px;border-radius:14px;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6)}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}.sw.on{border:3px solid #fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.c{text-align:center}
.day{min-height:42px;border-radius:14px;border:1px solid var(--line);background:var(--in);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day.tod{border-color:var(--rose)}.day.sel{background:rgba(224,38,63,.45);color:#fff}
.day i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--rose)}
.day.sel i{color:#fff}
.chart{display:flex;gap:8px;align-items:flex-end;height:120px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10px}
.chart b{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#FF7A90,#9B1230);min-height:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--in);border:1px solid var(--line);margin-right:3px}.dot.on{background:#E0263F;border-color:#FF7A90}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:rgba(10,2,5,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto}
.ov:empty{display:none}
.md{width:min(300px,100%);padding:14px;border-radius:18px;max-height:100%;overflow-y:auto;box-shadow:inset 0 1px 0 var(--spec),0 0 60px #E0263F55,0 30px 80px -20px #000}
.md form{flex-direction:column;align-items:stretch;margin:0;gap:8px}
.md label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.md form input[type=text]{flex:none;width:100%;min-height:32px;padding:5px 10px;font-size:13px;border-radius:10px}
.md .btn,.md .ghost{min-height:34px;padding:6px 14px;font-size:12px}
.st{display:inline-flex;align-items:flex-start;gap:8px}.st:before{content:"";flex:none;margin-top:4px;width:8px;height:8px;border-radius:50%;background:var(--muted)}.st.ok:before{background:#4ADE80;box-shadow:0 0 8px #4ADE80}
main{padding-bottom:84px}.avw{perspective:420px}.avb{transform-style:preserve-3d;animation:sway 5s ease-in-out infinite}.avh{position:absolute;inset:0;display:flex;gap:16px;align-items:center;justify-content:center;transform:translateZ(0)}@keyframes sway{0%,100%{transform:rotateY(-16deg) translateY(0)}50%{transform:rotateY(16deg) translateY(-6px)}}
.cp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:4px;padding:2px 16px 2px 2px;border-radius:999px;width:auto;cursor:pointer;text-align:left}.cp .avw{transform:scale(.42);margin:-38px -43px}.cpt{display:flex;flex-direction:column;gap:2px;font-size:12px}
.pop{animation:pop .55s ease}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4);box-shadow:0 0 28px #FF4D6A}100%{transform:scale(1)}}.ear{position:absolute;border:2px solid rgba(0,0,0,.18);box-sizing:border-box}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:700px){.side{flex-direction:row;width:100%;overflow-x:auto;padding:10px}.logo{padding:0 8px}.app{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav class="glass side" id="nav" aria-label="Módulos"></nav>
<main id="main"></main><div id="cp"></div><div id="ov"></div>
</div>
<script>
const K='lifeos.v1';
const D=()=>({theme:'dark',name:'',tasks:[],projects:[],goals:[],habits:[],notes:[],av:{c:'#FF4D6A',a:'halo',s:'orb'},focus:[],role:'',goal:'',pd:false,ts:0,books:[],ft:''});
let S;try{S=Object.assign(D(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=D()}
let REF=null,SY='local',CHK=false,PT,PM=false;
const save=r=>{if(!r)S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
function push(){if(!REF)return;clearTimeout(PT);PT=setTimeout(()=>{REF.set({json:JSON.stringify(S),ts:S.ts||0}).then(()=>{if(SY!=='ok'){SY='ok';render()}}).catch(()=>{SY='err'})},700)}
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=k=>new Date(k+'T00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const PL=['Baja','Media','Alta'];
const CK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>';
const NAV=[['dash','Dashboard','M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z'],['tareas','Tareas','M5 12l4 4 10-10'],['proyectos','Proyectos','M3 7h6l2 2h10v10H3z'],['metas','Metas','M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z'],['habitos','Hábitos','M13 3L5 14h6l-1 7 8-11h-6z'],['notas','Notas','M6 3h9l4 4v14H6zM9 12h7M9 16h7'],['calendario','Calendario','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],['stats','Estadísticas','M5 20V10M12 20V4M19 20v-7'],['resumen','Resumen','M4 5h16M4 12h10M4 19h16'],['uni','Universidad','M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5'],['lib','Biblioteca','M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3zM8 8h6']];
let V=location.hash.slice(1);if(!NAV.some(n=>n[0]===V))V='dash';
const now=new Date();let C={y:now.getFullYear(),m:now.getMonth(),sel:today()};
const F={on:false,start:0,iv:null,len:1500,br:false,tid:''};let AE=false,ET='',JT='',Q='',QP='';
const pj=id=>S.projects.find(p=>p.id===id);
const streak=h=>{let n=0,d=new Date();if(!h.days.includes(iso(d)))d.setDate(d.getDate()-1);while(h.days.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n};
const pend=()=>S.tasks.filter(t=>!t.done).sort((a,b)=>b.p-a.p||(a.due||'9').localeCompare(b.due||'9'));
function prog(){const t=today(),td=S.tasks.filter(x=>x.dd===t).length,tl=S.tasks.filter(x=>!x.done&&x.due&&x.due<=t).length,hd=S.habits.filter(h=>h.days.includes(t)).length,tot=td+tl+S.habits.length;return{done:td+hd,tot,pct:tot?Math.round((td+hd)/tot*100):0}}
const mood=()=>{const p=prog();return F.on?'concentrado':(p.tot&&p.pct===100?'alegre':'alentador')};
function msg(){const p=prog(),m=pend()[0],od=S.tasks.filter(x=>!x.done&&x.due&&x.due<today()).length;
if(F.br)return 'Descanso de 5 minutos. Levántate, toma agua y vuelve.';
if(F.on)return 'Una sola cosa ahora: '+(m?m.t:'lo que tienes delante')+'. Lo demás espera.';
if(p.tot&&p.pct===100)return 'Día cerrado. Hiciste lo que dijiste que harías.';
if(!m&&!S.habits.length)return 'Todo está vacío. Agrega tu primera tarea con fecha y empieza hoy.';
if(od)return od+(od>1?' tareas vencidas':' tarea vencida')+'. No es un reproche: elige una y dale 10 minutos.';
if(p.done>0)return 'Ya arrancaste, y eso era lo difícil. Sigue con: '+(m?m.t:'tus hábitos')+'.';
return m?'Empieza con 10 minutos en: '+m.t+'. Después cuesta menos.':'Marca tus hábitos de hoy para arrancar.'}
function avatarOld(){const a=S.av,c=a.c,m=mood(),SH={orb:[92,84,'50%'],cap:[78,100,'40px'],gato:[92,80,'45%'],conejo:[80,88,'48%'],oso:[96,84,'46%'],zorro:[92,80,'50% 50% 46% 46%']}[a.s]||[92,84,'50%'];
const eye={concentrado:'width:16px;height:4px;border-radius:2px;background:#2A0710',alegre:'width:16px;height:9px;border-radius:16px 16px 0 0;border-top:4px solid #2A0710',alentador:'width:10px;height:10px;border-radius:50%;background:#2A0710'}[m];
return `<div class="avw">${a.a==='halo'?`<div style="position:absolute;top:2px;width:64px;height:16px;border-radius:50%;border:3px solid ${c};box-shadow:0 0 14px ${c}"></div>`:''}${a.a==='corona'?'<div style="position:absolute;top:6px;z-index:2;width:46px;height:20px;background:#FFD27A;clip-path:polygon(0 100%,0 20%,25% 60%,50% 0,75% 60%,100% 20%,100% 100%)"></div>':''}${a.a==='estrella'?'<div style="position:absolute;top:0;z-index:2;width:26px;height:26px;background:#FFD27A;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)"></div>':''}<div class="avb" style="width:${SH[0]}px;height:${SH[1]}px;border-radius:${SH[2]};background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),${c} 45%,#2A0710);box-shadow:0 0 40px ${c}88,inset 0 -8px 18px rgba(0,0,0,.35)">${ears(a.s,c)}${a.a==='visor'?'<div class="visor"></div>':''}${a.a==='lentes'?'<div class="visor" style="height:24px;background:rgba(0,0,0,.2);border:3px solid #2A0710"></div>':''}<i style="${eye}"></i><i style="${eye}"></i></div></div>`}
const row=t=>ET===t.id?eform(t):`<div class="row"><button class="chk${t.done?' on':''}${JT===t.id?' pop':''}" data-a="tt" data-i="${t.id}" aria-label="Marcar: ${esc(t.t)}">${CK}</button><span class="fl${t.done?' dn':''}">${esc(t.t)}</span><span class="tag${t.p===2?' p2':''}">${PL[t.p]}</span>${t.due?`<span class="tag${!t.done&&t.due<today()?' od':''}">${fd(t.due)}</span>`:''}${pj(t.proj)?`<span class="tag">${esc(pj(t.proj).n)}</span>`:''}${t.rep?'<span class="tag">repite</span>':''}<button class="ghost" data-a="te" data-i="${t.id}">Editar</button><button class="x" data-a="td" data-i="${t.id}" aria-label="Eliminar tarea">×</button></div>`;
const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const hRow=h=>{const t=today(),on=h.days.includes(t);let dots='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dots+=`<span class="dot${h.days.includes(iso(d))?' on':''}"></span>`}
return `<div class="row"><button class="chk${on?' on':''}" data-a="th" data-i="${h.id}" aria-label="Marcar hábito: ${esc(h.n)}">${CK}</button><span class="fl">${esc(h.n)}</span><span aria-hidden="true">${dots}</span><span class="tag">racha ${streak(h)}</span><button class="x" data-a="hd" data-i="${h.id}" aria-label="Eliminar hábito">×</button></div>`};
const gp=g=>Math.round(Math.min(g.val/g.target,1)*100);
const proOpts=()=>'<option value="">Sin proyecto</option>'+S.projects.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('');
const head=(t,s)=>`<header style="margin-bottom:18px"><div class="hud">${s}</div><h1>${t}</h1></header>`;
const taskForm=()=>`<form data-f="task"><input type="text" name="t" placeholder="Nueva tarea" aria-label="Tarea" required><select name="p" aria-label="Prioridad"><option value="2">Alta</option><option value="1" selected>Media</option><option value="0">Baja</option></select><select name="rep" aria-label="Repetir">${repOpts('')}</select><input type="date" name="due" aria-label="Fecha límite"><select name="proj" aria-label="Proyecto">${proOpts()}</select><button class="btn" type="submit">Agregar</button></form>`;

function vDash(){const p=prog(),m=pend()[0],nx=pend().slice(1,3),up=pend().filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4),l=F.on?Math.max(0,F.len-Math.floor((Date.now()-F.start)/1000)):1500;
const msgs={concentrado:'Modo enfoque activo. Yo vigilo el tiempo.',alegre:'¡Objetivos completos! Buen cierre.',alentador:(pend().length?pend().length+' pendientes. Tú puedes con el primero.':'Sin pendientes. Agrega lo siguiente.')};
const pa=S.av;
return `<header style="display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:18px"><div><div class="hud">LIFE OS // ${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1 style="margin-top:6px">Hola, <input type="text" data-c="name" value="${esc(S.name)}" placeholder="tu nombre" aria-label="Tu nombre" style="font:inherit;width:min(60vw,11ch);background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:0;color:var(--text)"></h1>${S.goal?`<div style="margin:6px 0;color:var(--rose)">Objetivo: ${esc(S.goal)}</div>`:''}<div class="hud" style="margin:6px 0"><span class="st${SY==='ok'?' ok':''}">${SY==='ok'?'sincronizado':'solo este dispositivo'}</span></div><div class="empty">${pend().length?`Tienes ${pend().length} tarea${pend().length>1?'s':''} pendiente${pend().length>1?'s':''}${up[0]?` y tu fecha más cercana es el ${fd(up[0].due)}`:''}.`:'No tienes tareas pendientes.'}</div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" data-a="popen">Perfil</button><button class="ghost" data-a="theme">${S.theme==='dark'?'Modo claro':'Modo oscuro'}</button></div></header>
<div class="g">
${rem()}<section class="glass full" style="display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;background:linear-gradient(120deg,rgba(224,38,63,.38),var(--g2))"><div style="flex:1 1 340px;min-width:0"><div class="hud">Prioridad principal</div><h2 style="font-size:clamp(18px,2.4vw,24px);margin:8px 0 10px;line-height:1.15">${m?esc(m.t):'Aún no tienes prioridad definida'}</h2>${m?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="tag">${PL[m.p]}</span>${m.due?`<span class="tag">vence: ${fd(m.due)}</span>`:''}</div>`:''}<p style="margin:0 0 18px;max-width:520px;line-height:1.5">${esc(msg())}</p><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="btn" data-a="focus">${F.on?'Terminar sesión':'Iniciar sesión de enfoque'}</button><select data-c="ft" aria-label="Tarea a enfocar" style="max-width:190px"><option value="">Sin tarea</option>${pend().map(t=>`<option value="${t.id}"${S.ft===t.id?' selected':''}>${esc(t.t.slice(0,26))}</option>`).join('')}</select>${F.br?'<span class="hud">descanso</span>':''}<span class="hud big" id="tm" role="timer">${String(Math.floor(l/60)).padStart(2,'0')}:${String(l%60).padStart(2,'0')}</span></div></div>

function vLib(){return head('Biblioteca','Libros y avance de lectura')+`<form data-f="book"><input type="text" name="t" placeholder="Título" aria-label="Título" required><input type="text" name="a" placeholder="Autor" aria-label="Autor"><input type="number" name="n" min="1" placeholder="Páginas" aria-label="Páginas" style="width:100px" required><button class="btn" type="submit">Agregar</button></form><div class="g">${S.books.map(b=>{const p=Math.round(Math.min(b.pg/b.n,1)*100);return `<section class="glass"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(b.t)}</h3><button class="x" data-a="bd" data-i="${b.id}" aria-label="Eliminar libro">×</button></div><div class="hud" style="margin:4px 0 10px">${esc(b.a||'Autor desconocido')} · ${b.pg} de ${b.n} págs · ${p}%${p>=100?' · leído':''}</div>${bar(p)}<div style="display:flex;gap:8px;margin-top:12px"><button class="ghost" data-a="bm" data-i="${b.id}">−10 págs</button><button class="ghost" data-a="bp" data-i="${b.id}">+10 págs</button></div></section>`}).join('')||'<div class="empty">Aún no hay libros.</div>'}</div>`}
const VW={dash:vDash,tareas:vTareas,proyectos:vProy,metas:vMetas,habitos:vHab,notas:vNotas,calendario:vCal,stats:vStats,resumen:vRes,uni:vUni,lib:vLib};
function render(){document.documentElement.dataset.theme=S.theme;
$('#nav').innerHTML='<div class="logo">LOS</div>'+NAV.map(n=>`<button class="nav${n[0]===V?' on':''}" data-a="nav" data-i="${n[0]}" aria-label="${n[1]}" title="${n[1]}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${n[2]}"/></svg></button>`).join('');
$('#main').innerHTML=VW[V]();$('#cp').innerHTML=V==='dash'?'':`<button class="glass cp" data-a="nav" data-i="dash" aria-label="Ir al dashboard con ${esc(S.av.n||'tu compañero')}">${avatar()}<span class="cpt"><b>${esc(S.av.n||'Compañero')}</b><span class="hud">${mood()}</span></span></button>`;const o=$('#ov'),had=!!o.firstChild;o.innerHTML=modal();if(!had&&o.firstChild)o.querySelector('input').focus()}
function tick(){const l=Math.max(0,F.len-Math.floor((Date.now()-F.start)/1000)),e=$('#tm');if(e)e.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');if(!l){if(!F.br){logF();F.br=true;F.len=300;F.start=Date.now();render()}else stopF()}}
function logF(){const m=Math.min(25,Math.round((Date.now()-F.start)/6e4));if(m>=1)S.focus.push({d:today(),m,t:F.tid||''});save()}
function stopF(){clearInterval(F.iv);if(!F.br)logF();F.on=false;F.br=false;render()}
function act(a,i){JT='';const t=S.tasks.find(x=>x.id===i),h=S.habits.find(x=>x.id===i),g=S.goals.find(x=>x.id===i),b=S.books.find(x=>x.id===i);
if(a==='nav'){V=i;Q='';QP='';location.hash=i}
else if(a==='theme')S.theme=S.theme==='dark'?'light':'dark';
else if(a==='focus'){if(F.on)return stopF();F.on=true;F.br=false;F.len=1500;F.tid=S.ft;F.start=Date.now();F.iv=setInterval(tick,1000)}
else if(a==='tt'){t.done=!t.done;t.dd=t.done?today():'';JT=t.done?i:'';if(t.done&&t.rep){const d=new Date((t.due||today())+'T00:00');d.setDate(d.getDate()+(t.rep==='d'?1:7));S.tasks.push({...t,id:uid(),done:false,dd:'',due:iso(d)})}}
else if(a==='te')ET=i;
else if(a==='tx')ET='';
else if(a==='td')S.tasks=S.tasks.filter(x=>x.id!==i);
else if(a==='th'){const k=today();h.days=h.days.includes(k)?h.days.filter(d=>d!==k):h.days.concat(k)}
else if(a==='hd')S.habits=S.habits.filter(x=>x.id!==i);
else if(a==='pd'){S.projects=S.projects.filter(x=>x.id!==i);S.tasks.forEach(x=>{if(x.proj===i)x.proj=''})}
else if(a==='gd')S.goals=S.goals.filter(x=>x.id!==i);
else if(a==='gm')g.val=Math.max(0,g.val-1);
else if(a==='gpl')g.val+=1;
else if(a==='nd')S.notes=S.notes.filter(x=>x.id!==i);
else if(a==='cd')C.sel=i;
else if(a==='cp'){C.m--;if(C.m<0){C.m=11;C.y--}}
else if(a==='cn'){C.m++;if(C.m>11){C.m=0;C.y++}}
else if(a==='avedit')AE=!AE;
else if(a==='pskip')S.pd=true;
else if(a==='pclose')PM=false;
else if(a==='popen')PM=true;
else if(a==='bd')S.books=S.books.filter(x=>x.id!==i);
else if(a==='bm')b.pg=Math.max(0,b.pg-10);
else if(a==='bp')b.pg=Math.min(b.n,b.pg+10);
else if(a==='avc')S.av.c=i;else if(a==='ava'){if(!UN()[i]||UN()[i][0])S.av.a=i}else if(a==='avs')S.av.s=i;
save();render()}
function sub(f,d,id){const s=k=>(d.get(k)||'').trim();
if(f==='task'&&s('t'))S.tasks.push({id:uid(),t:s('t'),p:+d.get('p'),due:s('due'),proj:s('proj'),rep:s('rep'),done:false,dd:''});
else if(f==='proj'&&s('n'))S.projects.push({id:uid(),n:s('n')});
else if(f==='goal'&&s('n')&&+d.get('tg')>0)S.goals.push({id:uid(),n:s('n'),target:+d.get('tg'),val:0});
else if(f==='hab'&&s('n'))S.habits.push({id:uid(),n:s('n'),days:[]});
else if(f==='prof'&&s('n')){S.name=s('n');S.role=s('r');S.goal=s('g');S.pd=true;PM=false}
else if(f==='tedit'){const t=S.tasks.find(x=>x.id===id);if(t&&s('t')){t.t=s('t');t.p=+d.get('p');t.due=s('due');t.proj=s('proj');t.rep=s('rep');ET=''}}
else if(f==='course'&&s('n'))S.projects.push({id:uid(),n:s('n'),u:true,gr:[]});
else if(f==='grade'){const c=S.projects.find(x=>x.id===id);if(c&&s('g')!=='')(c.gr=c.gr||[]).push(+d.get('g'))}
else if(f==='entrega'&&s('t'))S.tasks.push({id:uid(),t:s('t'),p:2,due:s('due'),proj:id,done:false,dd:''});
else if(f==='book'&&s('t'))S.books.push({id:uid(),t:s('t'),a:s('a'),n:+d.get('n'),pg:0});
else if(f==='note'&&s('t'))S.notes.unshift({id:uid(),t:s('t'),b:d.get('b')||'',d:today()});
save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i)});
document.addEventListener('submit',e=>{e.preventDefault();sub(e.target.dataset.f,new FormData(e.target),e.target.dataset.i)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;const n=S.notes.find(x=>x.id===t.dataset.i);
if(c==='name')S.name=t.value.trim();else if(c==='nt')n.t=t.value;else if(c==='nb')n.b=t.value;else if(c==='ft')S.ft=t.value;else if(c==='avn'){S.av.n=t.value.trim();save();return render()}else if(c==='q'){Q=t.value.toLowerCase();return render()}else if(c==='qp'){QP=t.value;return render()}save()});
const modal=()=>{if(!(PM||(CHK&&!S.pd)))return '';const st=SY==='ok'?'<span class="st ok">Sincronización activa: tu progreso te sigue entre dispositivos.</span>':'<span class="st">Sin sincronización: tu progreso vive solo en este navegador. Abre el enlace con tu sesión de claude.ai para activarla.</span>';
return `<div class="ov"><div class="glass md" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="hud">LIFE OS // perfil</div><h2 id="mt" style="font-size:17px;margin:4px 0 6px">Configura tu sistema</h2><p class="empty" style="margin:0 0 8px;font-size:12px;line-height:1.4">Tu asistente te hablará por tu nombre y recordará qué quieres lograr.</p><form data-f="prof"><label>Tu nombre<input type="text" name="n" value="${esc(S.name)}" maxlength="40" required autocomplete="given-name"></label><label>A qué te dedicas<input type="text" name="r" value="${esc(S.role)}" maxlength="60" placeholder="Estudiante, diseñadora, emprendedor…"></label><label>Tu objetivo principal<input type="text" name="g" value="${esc(S.goal)}" maxlength="90" placeholder="¿Qué quieres lograr este mes?"></label><div class="hud" style="text-transform:none;letter-spacing:0;line-height:1.35;font-size:10px">${st}</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Guardar y entrar</button>${S.pd?'<button class="ghost" type="button" data-a="pclose">Cerrar</button>':'<button class="ghost" type="button" data-a="pskip">Omitir por ahora</button>'}</div></form></div></div>`};
async function initSync(){try{const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);const id=db&&u?await u.id():null;if(!id){CHK=true;render();return}
REF=db.doc('data/users/'+id+'/state');
REF.onSnapshot(s=>{const first=!CHK,was=SY;let ap=false;if(s.exists){try{const d=s.data();if(d.ts>(S.ts||0)){try{localStorage.setItem(K+'.bak',JSON.stringify(S))}catch(e){}S=Object.assign(D(),JSON.parse(d.json));save(1);SY='ok';ap=true}else if(d.ts<(S.ts||0))push();else SY='ok'}catch(e){}}else{if(!S.ts)S.ts=Date.now();push()}
CHK=true;if(ap||first||SY!==was)render()},()=>{CHK=true;SY='err';render()})}catch(e){CHK=true;render()}}
if(typeof claude!=='undefined'&&claude.use)initSync();else CHK=true;
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.ov')&&$('.ov').firstChild){if(S.pd)PM=false;else S.pd=true;save();render()}});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(NAV.some(n=>n[0]===v)&&v!==V){V=v;render()}});
render();
</script>
</body>
</html>
